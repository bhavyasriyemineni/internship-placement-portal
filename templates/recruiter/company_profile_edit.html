{% extends 'base_recruiter.html' %}
{% block page_title %}Company Profile Settings{% endblock %}

{% block dashboard_content %}
<div class="max-w-4xl mx-auto animate-in fade-in duration-700">
    <form method="POST" enctype="multipart/form-data" class="space-y-8">
        {% csrf_token %}
        
        <div class="bg-white p-8 md:p-10 rounded-[2rem] shadow-sm border border-gray-100">
            <h3 class="text-xl font-bold text-[#1E3A8A] font-poppins mb-8 flex items-center gap-3">
                <i class="fa-solid fa-id-card text-[#10B981]"></i> Corporate Identity
            </h3>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <div class="md:col-span-2 flex items-center gap-8 p-6 bg-slate-50 rounded-2xl border border-dashed border-gray-200">
                    <div class="relative group">
                        <img id="logo-preview" src="{{ profile.company_logo.url }}" 
                             class="w-24 h-24 rounded-2xl object-cover border-4 border-white shadow-md group-hover:opacity-75 transition-all">
                        <div class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-all pointer-events-none">
                            <i class="fa-solid fa-camera text-white text-xl"></i>
                        </div>
                    </div>
                    <div class="flex-1">
                        <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-2">Company Logo</label>
                        <input type="file" name="logo" onchange="previewImage(this)"
                               class="w-full text-xs text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-[10px] file:font-black file:uppercase file:bg-[#1E3A8A] file:text-white hover:file:bg-[#10B981] transition-all">
                        <p class="mt-2 text-[10px] text-gray-400">Recommended: Square PNG or JPG, Max 2MB.</p>
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-3">Legal Company Name</label>
                    <input type="text" name="company_name" value="{{ profile.company_name }}" required
                           class="w-full p-4 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-[#1E3A8A] transition-all text-sm font-medium">
                </div>

                <div>
                    <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-3">Industry Sector</label>
                    <select name="industry" class="w-full p-4 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-[#1E3A8A] transition-all text-sm font-medium appearance-none">
                        <option value="IT/Software" {% if profile.industry == "IT/Software" %}selected{% endif %}>Information Technology</option>
                        <option value="Finance" {% if profile.industry == "Finance" %}selected{% endif %}>Finance & Fintech</option>
                        <option value="Manufacturing" {% if profile.industry == "Manufacturing" %}selected{% endif %}>Manufacturing</option>
                        <option value="Healthcare" {% if profile.industry == "Healthcare" %}selected{% endif %}>Healthcare</option>
                    </select>
                </div>

                <div>
                    <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-3">Official Website</label>
                    <div class="relative">
                        <i class="fa-solid fa-globe absolute left-4 top-1/2 -translate-y-1/2 text-gray-300"></i>
                        <input type="url" name="website" value="{{ profile.website }}" placeholder="https://company.com"
                               class="w-full pl-12 pr-4 py-4 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-[#1E3A8A] transition-all text-sm font-medium">
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-3">Headquarters Location</label>
                    <div class="relative">
                        <i class="fa-solid fa-location-dot absolute left-4 top-1/2 -translate-y-1/2 text-gray-300"></i>
                        <input type="text" name="location" value="{{ profile.location }}" placeholder="City, Country"
                               class="w-full pl-12 pr-4 py-4 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-[#1E3A8A] transition-all text-sm font-medium">
                    </div>
                </div>

                <div class="md:col-span-2">
                    <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-3">Company Description</label>
                    <textarea name="description" rows="4" required
                              class="w-full p-4 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-[#1E3A8A] transition-all text-sm leading-relaxed"
                              placeholder="Describe your company mission and industrial focus...">{{ profile.description }}</textarea>
                </div>
            </div>
        </div>

        <div class="flex flex-col sm:flex-row gap-4">
            <button type="submit" class="flex-1 bg-[#1E3A8A] text-white py-4 px-8 rounded-2xl font-bold uppercase tracking-widest text-xs hover:shadow-[0_10px_25px_rgba(30,58,138,0.3)] transition-all">
                Save Profile Changes <i class="fa-solid fa-circle-check ml-2"></i>
            </button>
            <a href="{% url 'recruiter_dashboard' %}" class="flex-1 bg-white text-gray-400 border border-gray-200 py-4 px-8 rounded-2xl font-bold uppercase tracking-widest text-xs text-center hover:bg-gray-50 transition-all">
                Cancel
            </a>
        </div>
    </form>
</div>
<div class="form-group">
    <label>Contact Email</label>
    <input 
        type="email" 
        name="contact_email" 
        value="{{ profile.contact_email }}" 
        class="form-control" 
        required>
</div>


<script>
    function previewImage(input) {
        if (input.files && input.files[0]) {
            var reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('logo-preview').setAttribute('src', e.target.result);
            }
            reader.readAsDataURL(input.files[0]);
        }
    }
</script>
{% endblock %}
