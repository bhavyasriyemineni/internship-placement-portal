{% extends 'base_student.html' %}
{% block page_title %}Edit Profile Details{% endblock %}

{% block dashboard_content %}
<form method="POST" enctype="multipart/form-data" class="max-w-4xl mx-auto space-y-6">
    {% csrf_token %}
    <div class="bg-white rounded-xl shadow-sm p-8 border border-gray-100">
        <h4 class="text-lg font-bold text-[#1E3A8A] mb-6">Personal & Academic Info</h4>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <label class="block text-[10px] font-black text-gray-400 uppercase mb-2">Current CGPA</label>
                <input type="number" step="0.01" name="cgpa" value="{{ profile.cgpa }}" class="w-full bg-gray-50 border border-gray-200 rounded-lg p-3 outline-none focus:ring-2 focus:ring-[#1E3A8A] transition-all">
            </div>
            <div>
                <label class="block text-[10px] font-black text-gray-400 uppercase mb-2">Resume Upload (PDF)</label>
                <input type="file" name="resume" class="w-full text-xs text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-[10px] file:font-black file:uppercase file:bg-blue-50 file:text-[#1E3A8A] hover:file:bg-blue-100">
            </div>
            <div class="md:col-span-2">
                <label class="block text-[10px] font-black text-gray-400 uppercase mb-2">Skills (Comma Separated)</label>
                <textarea name="skills" rows="3" class="w-full bg-gray-50 border border-gray-200 rounded-lg p-3 outline-none focus:ring-2 focus:ring-[#1E3A8A] transition-all">{{ profile.skills }}</textarea>
            </div>
        </div>
        <div class="mt-8 flex gap-4">
            <button type="submit" class="bg-[#1E3A8A] text-white px-8 py-3 rounded-lg text-xs font-bold hover:shadow-[0_0_15px_rgba(30,58,138,0.3)] transition-all">Save Changes</button>
            <a href="{% url 'student_profile' %}" class="bg-gray-100 text-gray-500 px-8 py-3 rounded-lg text-xs font-bold transition-all">Cancel</a>
        </div>
    </div>
</form>
{% endblock %}
