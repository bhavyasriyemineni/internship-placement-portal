{% extends 'base_public.html' %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center py-12 px-4">
    <div class="max-w-md w-full bg-white p-10 rounded-[2rem] shadow-soft border border-gray-400 shadow-xl">
        {% if messages %}
            {% for message in messages %}
                <div class="mb-4 p-4 rounded-xl text-sm font-bold {% if message.tags == 'success' %}bg-emerald-50 text-emerald-700 border border-emerald-200{% else %}bg-red-50 text-red-700 border border-red-200{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <div class="text-center mb-8">
            <h2 class="text-3xl font-bold text-blue-900 font-poppins">Welcome Back</h2>
            <p class="text-gray-500 text-sm mt-2">Log in to manage your placement journey</p>
        </div>

        <form method="POST" class="space-y-6">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase tracking-widest mb-2">Email</label>
                <input type="email" name="email" required class="w-full p-4 bg-slate-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-900 outline-none">
            </div>

            <div>
                <div class="flex justify-between mb-2">
                    <label class="text-xs font-bold text-gray-700 uppercase tracking-widest">Password</label>
                    <a href="{% url 'password_reset' %}" class="text-xs font-bold text-blue-900 hover:text-emerald-500">Forgot?</a>
                </div>
                <input type="password" name="password" required class="w-full p-4 bg-slate-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-900 outline-none">
            </div>

            <button type="submit" class="w-full btn-primary text-white p-5 rounded-2xl font-bold uppercase tracking-widest text-sm">
                Login <i class="fa-solid fa-right-to-bracket ml-2"></i>
            </button>
        </form>
    </div>
</div>
{% endblock %}
