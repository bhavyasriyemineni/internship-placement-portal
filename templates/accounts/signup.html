{% extends 'base_public.html' %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center py-12 px-4">
    <div class="max-w-md w-full bg-white p-10 rounded-[2rem] shadow-soft border border-gray-400 shadow-xl animate-in fade-in zoom-in duration-500">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-bold text-blue-900 font-poppins">Create Account</h2>
            <p class="text-gray-500 text-sm mt-2 font-inter">Join the industry placement network</p>
        </div>

        <form method="POST" class="space-y-6">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase tracking-widest mb-2">Register As</label>
                <select name="role" class="w-full p-4 bg-slate-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-900 outline-none transition-all">
                    <option value="student">Student (Applying for Training)</option>
                    <option value="recruiter">Recruiter (Hiring Talent)</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase tracking-widest mb-2">Email Address</label>
                <input type="email" name="email" required class="w-full p-4 bg-slate-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-900 outline-none">
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase tracking-widest mb-2">Password</label>
                <input type="password" name="password" required class="w-full p-4 bg-slate-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-900 outline-none">
            </div>

            <button type="submit" class="w-full btn-primary text-white p-5 rounded-2xl font-bold uppercase tracking-widest text-sm shadow-lg hover:shadow-emerald-500/20 transition-all">
                Sign Up & Verify <i class="fa-solid fa-paper-plane ml-2"></i>
            </button>
        </form>

        <p class="text-center mt-8 text-sm text-gray-500">
            Already have an account? <a href="{% url 'login' %}" class="text-blue-900 font-bold hover:underline">Login here</a>
        </p>
    </div>
</div>
{% endblock %}
